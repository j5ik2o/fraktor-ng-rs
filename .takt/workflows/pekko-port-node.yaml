name: pekko-port-node
description: >-
  ゴールのノードを1件だけ移植するサブワークフロー。
  triage → テスト移植 → red 確認（system step）→ 実装 → 機械ゲート（system step）
  → 等価性レビュー → 台帳更新、の順で処理し、結果を return ラベルで親へ返す。
  設計の正は docs/decisions/takt-workflow-design.md。
subworkflow:
  callable: true
  visibility: internal
  returns:
    - node_green
    - goal_complete
    - needs_human
initial_step: triage
loop_monitors:
  # equivalence-review の差し戻しは 3 回まで（決定 c）
  - cycle:
      - equivalence-review
      - implement
    threshold: 3
    judge:
      persona: supervisor
      instruction: pekko-loop-judge
      rules:
        - condition: 健全（指摘数が減少、修正が反映されている）
          next: implement
        - condition: 非生産的（同じ指摘が繰り返される）
          next: ABORT
steps:
  - name: triage
    edit: false
    persona: research-analyzer
    knowledge:
      - pekko-porting-rules
    instruction: pekko-triage
    rules:
      - condition: 前提が揃っており、除外提案がない
        next: port-test
      - condition: 除外提案がある（ケース除外または do_not_port の提案）
        next: human-checkpoint
      - condition: 前提基盤が未 green、または Pekko 原典を参照できない
        next: ABORT
    output_contracts:
      report:
        - name: triage-report.md
          format: triage-report
  - name: human-checkpoint
    edit: false
    persona: supervisor
    knowledge:
      - pekko-porting-rules
    requires_user_input: true
    input_reports:
      from_step: triage
      reports:
        - triage-report.md
    instruction: pekko-human-checkpoint
    rules:
      - condition: ユーザーが除外提案を承認した
        next: port-test
        requires_user_input: true
        interactive_only: true
      - condition: ユーザーが除外提案を却下した
        return: needs_human
        requires_user_input: true
        interactive_only: true
    output_contracts:
      report:
        - name: human-checkpoint-report.md
          format: verify-report
  - name: port-test
    edit: true
    persona: coder
    policy:
      - coding
      - testing
    knowledge:
      - pekko-porting-rules
    required_permission_mode: edit
    input_reports:
      - from_step: triage
        reports:
          - triage-report.md
      - from_step: human-checkpoint
        reports:
          - human-checkpoint-report.md
        optional_if_unrun: true
    instruction: pekko-port-test
    rules:
      - condition: テストの移植が完了した（除外は承認済みの提案だけを反映）
        next: verify_red
      - condition: 移植を進行できない
        next: ABORT
    output_contracts:
      report:
        - name: port-test-report.md
          format: verify-report
  - name: verify_red
    kind: system
    system_inputs:
      - type: command
        as: result
        command: python3 ledger/tools/verify_red.py
        timeout_ms: 600000
        output: json
    rules:
      - condition: when(context.verify_red.result.json.classification == "expected_compile_error")
        next: implement
      - condition: when(context.verify_red.result.json.classification == "expected_assertion")
        next: implement
      - condition: when(context.verify_red.result.json.classification == "unexpected_pass")
        next: port-test
      - condition: when(context.verify_red.result.json.classification == "unclassifiable")
        next: classify-red
      - condition: when(true)
        next: ABORT
  - name: classify-red
    # 機械分類できなかった場合だけ、軽量な判定で red の妥当性を判断する（決定 d）
    edit: true
    persona: coder
    knowledge:
      - pekko-porting-rules
    required_permission_mode: edit
    instruction:
      - pekko-classify-red
      - "対象コマンドの出力（末尾）: {context:verify_red.result.stdout} {context:verify_red.result.stderr}"
    rules:
      - condition: 想定どおりの失敗であり、台帳の status を red に更新した
        next: implement
      - condition: 想定外の失敗、または最初から成功していた
        next: port-test
      - condition: 判断できない
        next: ABORT
    output_contracts:
      report:
        - name: classify-red-report.md
          format: verify-report
  - name: implement
    edit: true
    persona: coder
    policy:
      - coding
    knowledge:
      - pekko-porting-rules
    required_permission_mode: edit
    input_reports:
      - from_step: port-test
        reports:
          - port-test-report.md
      - from_step: equivalence-review
        reports:
          - equivalence-review.md
        optional_if_unrun: true
    instruction: pekko-implement
    rules:
      - condition: 実装が完了した（テストファイルは変更していない）
        next: verify_green
      - condition: write_scope の拡張が必要
        next: implement
        requires_user_input: true
        interactive_only: true
      - condition: テスト自体の不備が判明した
        next: triage
      - condition: 実装を進行できない
        next: ABORT
    output_contracts:
      report:
        - name: coder-scope.md
          format: coder-scope
        - name: coder-decisions.md
          format: coder-decisions
  - name: verify_green
    kind: system
    system_inputs:
      - type: command
        as: result
        command: python3 ledger/tools/verify_green.py
        timeout_ms: 900000
        output: json
    rules:
      - condition: when(context.verify_green.result.json.all_pass == true)
        next: equivalence-review
      - condition: when(true)
        next: implement
  - name: equivalence-review
    edit: false
    persona: testing-reviewer
    policy:
      - review
      - ai-antipattern
    knowledge:
      - pekko-porting-rules
    input_reports:
      - from_step: port-test
        reports:
          - port-test-report.md
      - from_step: implement
        reports:
          - coder-scope.md
          - coder-decisions.md
    instruction: pekko-review-equivalence
    rules:
      - condition: 指摘なし（原典との等価性に問題がない）
        next: ledger-update
      - condition: 指摘あり（原典側の根拠つき）
        next: implement
    output_contracts:
      report:
        - name: equivalence-review.md
          format: equivalence-review
  - name: ledger-update
    edit: true
    persona: coder
    knowledge:
      - pekko-porting-rules
    required_permission_mode: edit
    instruction: pekko-ledger-update
    rules:
      - condition: ゴール完了（rollup の完了判定が終了コード 0）
        return: goal_complete
      - condition: ゴール未完（残ノードがある）
        return: node_green
      - condition: 台帳の更新や判定を実行できない
        next: ABORT
    output_contracts:
      report:
        - name: ledger-report.md
          format: ledger-report
