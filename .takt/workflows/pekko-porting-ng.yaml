name: pekko-porting-ng
description: >-
  fraktor-ng-rs の Pekko 移植パイプライン（ゴール単位）。
  サブワークフロー pekko-port-node をノード1件ずつ呼び、ゴールが完了するまで
  繰り返す。設計の正は docs/decisions/takt-workflow-design.md。
# ノード数と差し戻しから決まる全体予算。子 workflow と共有される
max_steps: 80
initial_step: port_node
steps:
  - name: port_node
    description: ノードを1件移植する（triage から台帳更新まで）
    kind: workflow_call
    call: pekko-port-node
    rules:
      - condition: node_green
        next: port_node
      - condition: goal_complete
        next: COMPLETE
      - condition: needs_human
        next: ABORT
      - condition: ABORT
        next: ABORT
