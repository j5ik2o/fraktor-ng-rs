name: fraktor-port-node
description: >-
  ゴールのノードを1件だけ移植するサブワークフロー。
  triage → テスト移植 → red 確認（system step）
  → 実装とレビュー（builtin の mini-core に委譲）→ 機械ゲート（system step）
  → 等価性レビュー → 台帳更新、の順で処理し、結果を return ラベルで親へ返す。
  実装⇄レビュー⇄修正のループ品質は takt の builtin 資産（mini-core）が担い、
  このワークフローは台帳・原典・機械判定というドメイン固有の部分を持つ。
  設計の正は docs/decisions/takt-workflow-design.md。
all_steps:
  rules:
    - ref: findings-handling
      position: before_instruction
    - ref: plain-terminology
      position: before_instruction
    # syn チェッカーのルールの要約（.takt/workflows/rules/fraktor-coding-rules.md）。
    # policy と knowledge は連結した先頭 2,000 字だけが本文に載り、builtin の
    # fragment は policy の先頭に contract-change（約 4,400 字）を固定する。
    # workflow-wide rule は全文が本文に載り、workflow_call で呼ぶ mini-core の
    # 各ステップにも引き継がれる
    - ref: fraktor-coding-rules
      position: before_instruction
subworkflow:
  callable: true
  visibility: internal
  returns:
    - node_green
    - goal_complete
    - needs_human
initial_step: triage
loop_monitors:
  # 等価性レビューの差し戻し上限（決定 c）。連続 3 回目の指摘で judge が判定する。
  # 実際の経路は develop → verify_green → equivalence-review → develop で、
  # takt は完了したステップの並びをそのまま照合する。verify_green を照合から
  # 外し、レビューが develop へ差し戻す時点で judge を呼ぶ。
  # verify_green の失敗で develop をやり直すと連続は切れる（仕様として受け入れた）。
  # 全体の上限は親ワークフローの max_steps が持つ
  - cycle:
      - develop
      - equivalence-review
    ignore_steps:
      - verify_green
    threshold: 3
    judge:
      input_reports:
        - from_step: equivalence-review
          reports:
            - equivalence-review.md
          history:
            previous: 2
      persona: supervisor
      instruction: fraktor-loop-judge
      rules:
        - condition: 健全（指摘数が減少、修正が反映されている）
          next: develop
        - condition: 非生産的（同じ指摘が繰り返される）
          next: ABORT
  # verify_red の差し戻し上限（決定 c の verify 系 5 回）。移植したテストが想定どおりの
  # red にならず port-test へ差し戻される。連続 5 回目の差し戻しで judge が判定する。
  # classify-red を経由した差し戻しも数えるので、classify-red を照合から外す
  - cycle:
      - port-test
      - verify_red
    ignore_steps:
      - classify-red
    threshold: 5
    judge:
      input_reports:
        - from_step: port-test
          reports:
            - test-report.md
          history:
            previous: 2
        # classify-red の報告は渡せない。takt は judge の入力を cycle の中の
        # ステップに限る（classify-red は照合から外したステップである）
      persona: supervisor
      instruction: fraktor-verify-red-loop-judge
      rules:
        - condition: 健全（修正がテストに反映され、状況が前進している）
          next: port-test
        - condition: 非生産的（同じ理由のまま繰り返され、テストの修正が前進していない）
          next: ABORT
  # verify_green の差し戻し上限（決定 c の verify 系 5 回）。機械ゲートが落ちて develop へ
  # 差し戻される。連続 5 回目の差し戻しで judge が判定する。ゲートを通って
  # equivalence-review に進むと連続は切れる
  - cycle:
      - develop
      - verify_green
    threshold: 5
    judge:
      input_reports:
        # 名前で選ぶと、mini-core がその報告を書かずに終わった回に judge の準備が
        # 失敗する。all なら、その回に実際に書かれた報告だけが渡る
        - from_step: develop
          reports: all
          history:
            previous: 2
      persona: supervisor
      instruction: fraktor-verify-green-loop-judge
      rules:
        - condition: 健全（失敗が減っている、または内容が変わり、修正が前進している）
          next: develop
        - condition: 非生産的（同じ失敗が同じ内容のまま繰り返され、修正が前進していない）
          next: ABORT
steps:
  - name: triage
    edit: false
    persona: research-digger
    knowledge:
      - fraktor-porting-rules
    instruction: fraktor-triage
    rules:
      - condition: 前提が揃っており、未承認の除外提案がない（承認済みの除外は台帳の cases.excluded に記録されている）
        next: port-test
      - condition: 未整備（未作成または未 green）の前提基盤がすべて本ゴールの write_scope 内にあり、未承認の除外提案がない（bootstrap）
        next: port-test
      - condition: 未承認の除外提案がある（ケース除外または do_not_port の提案）
        return: needs_human
      - condition: 未整備（未作成または未 green）の前提基盤に、作成が本ゴールの write_scope の外のものが 1 つでもある（ゴール選定の順序ミス）
        next: ABORT
      - condition: Pekko 原典を参照できない
        next: ABORT
    output_contracts:
      report:
        - name: triage-report.md
          format: triage-report
  - name: port-test
    description: Pekko 原典のテストを移植する（実装より先に書く）
    uses: development-core-write-tests
    with:
      testing_policy:
        - coding
        - testing
      testing_knowledge:
        - fraktor-porting-rules
      testing_instruction: fraktor-port-test
      testing_report_format: test-report
    input_reports:
      - from_step: triage
        reports:
          - triage-report.md
    # verify_red の差し戻しによる 2 回目以降の実行は、runtime.yaml の ladder の
    # 次の段（強いモデル）で行う（2026-11-12 オーナー指示の段付き）
    promotion:
      - at: 2
    rules:
      - condition: テストの移植が完了した（除外は承認済みの提案だけを反映）
        next: verify_red
      - condition: 未承認の除外提案がある（移植できないケースが見つかり、人間の承認が要る）
        return: needs_human
      - condition: 移植を進行できない
        next: ABORT
  - name: verify_red
    kind: system
    system_inputs:
      - type: command
        as: result
        command: uv run --with pyyaml python3 ledger/tools/verify_red.py
        timeout_ms: 600000
        output: json
    rules:
      - condition: when(context.verify_red.result.json.classification == "expected_compile_error")
        next: develop
      - condition: when(context.verify_red.result.json.classification == "expected_assertion")
        next: develop
      - condition: when(context.verify_red.result.json.classification == "unexpected_pass")
        next: port-test
      - condition: when(context.verify_red.result.json.classification == "unclassifiable")
        next: classify-red
      - condition: when(true)
        next: ABORT
  - name: classify-red
    # 機械分類できなかった場合だけ、軽量な判定で red の妥当性を判断する（決定 d）
    edit: true
    persona: coder
    knowledge:
      - fraktor-porting-rules
    required_permission_mode: edit
    instruction:
      - fraktor-classify-red
      - "対象コマンドの出力（末尾）: {context:verify_red.result.stdout} {context:verify_red.result.stderr}"
    rules:
      - condition: 想定どおりの失敗であり、台帳の status を red に更新した
        next: develop
      - condition: 想定外の失敗、または最初から成功していた
        next: port-test
      - condition: 判断できない
        next: ABORT
    output_contracts:
      report:
        - name: classify-red-report.md
          format: verify-report
  - name: develop
    description: >-
      移植済みテストを通す実装を、builtin の mini-core（plan → implement →
      並列レビュー → 修正ループ）に委譲する。ドメイン規約は knowledge として
      注入され、mini-core 内の implement、supervisor、fix の各ステップに届く。
      テストファイルの凍結も knowledge `fraktor-porting-rules` が宣言する。
      knowledge は先頭 2,000 字だけが本文に載るので、移植規約を先頭に置く
    kind: workflow_call
    call: mini-core
    args:
      plan_policy:
        - design-planning
      plan_knowledge:
        - fraktor-porting-rules
        - architecture
      development_policy:
        - coding
        - testing
      development_knowledge:
        - fraktor-porting-rules
        - architecture
    input_reports:
      - from_step: triage
        reports:
          - triage-report.md
      - from_step: port-test
        reports:
          - test-report.md
      - from_step: equivalence-review
        reports:
          - equivalence-review.md
        optional_if_unrun: true
    rules:
      - condition: COMPLETE
        next: verify_green
      - condition: ABORT
        next: ABORT
  - name: verify_green
    kind: system
    system_inputs:
      - type: command
        as: result
        command: uv run --with pyyaml python3 ledger/tools/verify_green.py
        timeout_ms: 900000
        output: json
    rules:
      - condition: when(context.verify_green.result.json.all_pass == true)
        next: equivalence-review
      - condition: when(true)
        next: develop
  - name: equivalence-review
    description: 移植したテストと実装を Pekko 原典と突き合わせ、等価性の問題を報告する
    uses: development-testing-reviewer
    with:
      review_policy_additions:
        - ai-antipattern
      review_knowledge_additions: []
      testing_review_instruction: fraktor-review-equivalence
    # takt は knowledge を連結して先頭 2,000 字だけを本文に載せ、残りは
    # スナップショットファイルを読ませる。fragment の並び（unit-testing、
    # e2e-testing、追加分）のままだと移植規約が本文から外れるので、
    # 移植規約を先頭に置いた並びで上書きする
    knowledge:
      - fraktor-porting-rules
      - unit-testing
      - e2e-testing
    input_reports:
      - from_step: port-test
        reports:
          - test-report.md
      - from_step: develop
        reports: all
        optional_if_unrun: true
    rules:
      - condition: 指摘なし（原典との等価性に問題がない）
        next: ledger-update
      - condition: 指摘あり（原典側の根拠つき）
        next: develop
      - condition: 指摘はないが、原典または移植側を確認できず、等価性を判断できない
        next: ABORT
    output_contracts:
      report:
        - name: equivalence-review.md
          format: equivalence-review
  - name: ledger-update
    edit: true
    persona: coder
    knowledge:
      - fraktor-porting-rules
    required_permission_mode: edit
    instruction: fraktor-ledger-update
    rules:
      - condition: ゴール完了（rollup の完了判定が終了コード 0）
        return: goal_complete
      - condition: ゴール未完（残ノードがある）
        return: node_green
      - condition: 台帳の更新や判定を実行できない
        next: ABORT
    output_contracts:
      report:
        - name: ledger-report.md
          format: ledger-report
