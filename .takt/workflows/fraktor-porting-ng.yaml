name: fraktor-porting-ng
description: >-
  fraktor-ng-rs の Pekko 移植パイプライン（ゴール単位）。
  サブワークフロー fraktor-port-node をノード1件ずつ呼び、ゴールが完了するまで
  繰り返す。設計の正は docs/decisions/takt-workflow-design.md。
# ノード数と差し戻しから決まる全体予算。子 workflow と共有される
max_steps: 80
# 移植の原典 pekko/ が要るのはこの系統だけなので、プロジェクト全体ではなくここに置く。
# 親が init と各 port_node ステップの前に、作業ツリーを cwd にして実行する。
# 呼び先の fraktor-port-node は同じ cwd を使うため、子が始まる時点で pekko/ は揃っている。
workflow_config:
  runtime:
    prepare:
      - tools/pekko-source/prepare_pekko_source.sh
initial_step: port_node
loop_monitors:
  # node_green で次のノードに進んだ場合は完了関門を通らず、連続回数が切れる
  - cycle:
      - port_node
      - goal_complete_gate
    threshold: 5
    judge:
      input_reports:
        - from_step: port_node
          reports: all
          history:
            previous: 2
      persona: supervisor
      instruction: fraktor-goal-complete-loop-judge
      rules:
        - condition: 健全（台帳、検証結果、判明した原因に具体的な進展がある）
          next: port_node
        - condition: 非生産的（同じ完了阻害要因が続き、進展がない）
          next: ABORT
steps:
  - name: port_node
    description: ノードを1件移植する（triage から台帳更新まで）
    kind: workflow_call
    call: fraktor-port-node
    rules:
      - condition: node_green
        next: port_node
      - condition: goal_complete
        next: goal_complete_gate
      - condition: needs_human
        next: ABORT
      - condition: ABORT
        next: ABORT
  - name: goal_complete_gate
    description: >-
      ゴール完了を rollup.py --goal の終了コードで確かめる関門。
      0 なら COMPLETE、それ以外は port_node へ戻す。判定不能は port_node へ戻す。
    kind: system
    system_inputs:
      - type: command
        as: result
        command: uv run --with pyyaml python3 ledger/tools/goal_complete_gate.py
        timeout_ms: 600000
        output: json
    rules:
      - condition: when(context.goal_complete_gate.result.json.exit_code == 0)
        next: COMPLETE
      - condition: when(true)
        next: port_node
