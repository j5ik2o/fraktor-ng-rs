provider: codex
language: ja
concurrency: 1
base_branch: main

# ワークフロー内の system step が固定コマンド（台帳ツール）を実行するために必要
workflow_system_commands:
  custom_scripts: true

# provider が rate limit に達したときの切替先（順に試す）。同格のクラウド provider に
# 限る。判断系ステップを無断で DGX へ降格させないため、DGX への切替は fallback では
# なく人間が provider: を書き換えて行う。chain が尽きた run は失敗で止まり、成果は
# .takt/runs/ と作業ツリーに残る（再開は takt resume）
rate_limit_fallback:
  switch_chain:
    - provider: claude
