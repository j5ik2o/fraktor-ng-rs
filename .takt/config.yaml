language: ja
concurrency: 1
base_branch: main

# ワークフロー内の system step が固定コマンド（台帳ツール）を実行するために必要
workflow_system_commands:
  custom_scripts: true

# pekko-porting-ng の runtime.prepare（tools/pekko-source/prepare_pekko_source.sh）は
# preset ではないので、カスタムスクリプトの許可が要る（無いとワークフローの読み込みで失敗する）
workflow_runtime_prepare:
  custom_scripts: true

# provider が rate limit に達したときの切替先（順に試す）。同格のクラウド provider に
# 限る。判断系ステップを無断で DGX へ降格させないため、DGX への切替は fallback では
# なく runtime.yaml の assignment で行う。chain が尽きた run は失敗で止まり、成果は
# .takt/runs/ と作業ツリーに残る（直接実行の run は takt resume、manager タスクは requeue で再開）
rate_limit_fallback:
  switch_chain:
    - provider: claude
    # Ollama Cloud の Opus 級（2026-11-13 窓口決定）。Claude の週次制限に当たった run を
    # 止めずに判断級の作業を続けるための受け皿
    - provider: opencode
      model: ollama/glm-5.3:cloud

# マージ用タスク（takt_merge_goal_pr の until: merge）が使うワークフロー。builtin の
# merge-review-fix-simple は caccia が skipped のとき未解決スレッドがあっても merge へ進む。
# 未解決レビュースレッドが 0 件のときだけ merge する関門を足したワークフローを指定する
merge:
  workflow: merge-review-fix-simple-thread-gate

# manager（ゴール管理）がタスクに使ってよいワークフロー。未設定だと default と simple
# だけになり、移植パイプラインをゴールのタスクとして積めない（G0b の投入時に判明）
manager:
  workflows:
    - default
    - simple
    - pekko-porting-ng: 台帳のゴール（ノードの集合）を、Pekko のテストから 1 件ずつ移植する
