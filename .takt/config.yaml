language: ja
concurrency: 1
base_branch: main

# ワークフロー内の system step が固定コマンド（台帳ツール）を実行するために必要
workflow_system_commands:
  custom_scripts: true

# provider が rate limit に達したときの切替先（順に試す）。同格のクラウド provider に
# 限る。判断系ステップを無断で DGX へ降格させないため、DGX への切替は fallback では
# なく runtime.yaml の assignment で行う。chain が尽きた run は失敗で止まり、成果は
# .takt/runs/ と作業ツリーに残る（直接実行の run は takt resume、manager タスクは requeue で再開）
rate_limit_fallback:
  switch_chain:
    - provider: claude

# manager（ゴール管理）がタスクに使ってよいワークフロー。未設定だと default と simple
# だけになり、移植パイプラインをゴールのタスクとして積めない（G0b の投入時に判明）
manager:
  workflows:
    - default
    - simple
    - pekko-porting-ng: 台帳のゴール（ノードの集合）を、Pekko のテストから 1 件ずつ移植する
