[package]
name = "fraktor-actor"
version = "0.0.0"
edition = "2021"
# Crate-level license is Apache-2.0; per-file license headers state each source file's SPDX identifier.
license = "Apache-2.0"
publish = false

[features]
default = ["std"]
std = ["dep:getrandom"]
test-support = []

[dependencies]
getrandom = { version = "0.3", optional = true }
portable-atomic = { version = "1", default-features = false, features = ["fallback", "critical-section"] }
spin = { version = "0.9", default-features = false, features = ["spin_mutex", "once", "portable_atomic"] }

# The kernel's `Arc` (kernel/sync.rs) comes from here only on targets without
# pointer-sized atomics.
[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
portable-atomic-util = { version = "0.2", default-features = false, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
] }

[dev-dependencies]
fraktor-testkit = { path = "../fraktor-testkit" }
