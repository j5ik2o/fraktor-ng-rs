baseline:
  repo: https://github.com/apache/pekko.git
  tag: v1.7.1
  tag_reason: Latest stable v1.x.x release tag from `git ls-remote --tags` (RC/M milestone excluded; v1.8.0-M0 is a milestone, not stable).
method:
  extraction: Mechanical static extraction by scripts/analyze.py (regex/walk over build.sbt and sources). No compilation, no sbt run, no SemanticDB/SCIP. Java/sbt are not installed on this VM, so no `sbt
    projects` cross-check was done.
  module_dependencies: Identifiers of other known sbt projects inside .dependsOn(...) of each lazy-val block in build.sbt (strings/comments stripped). Syntactic approximation.
  test_cases_approx: 'Per test-class file: matches of ^"..." in (WordSpec), test(" (FunSuite/typed), @Test (JUnit). Approximate: helper-generated and programmatically registered tests are not counted exactly.'
  testkit_usage: Regex occurrence counts over all src/test sources of the module, imports included; files = files with >=1 hit. `within` counts within( calls in test sources and is not exclusively a TestKit
    method.
  test_to_impl: IMPORT-BASED APPROXIMATION ONLY. Referenced types come from org.apache.pekko.* imports (testkit packages excluded) of the test file; defining module guessed from class/object/trait/enum
    declarations in main sources (unique definitions only). SemanticDB/SCIP exact resolution not performed.
  premise_flags: Regex occurrence counts in src/test sources.
  known_gaps:
  - protobuf-v3 is a shaded-jar project with no source directory, and scala-nightly is an aggregate-only pseudo module; both have zero source stats.
  - 'Test->impl coverage is low: only 292 of 1262 test classes yield >=1 referenced type, because many tests live in the same package as the code under test (no import needed) or use wildcard imports (230
    files repo-wide import org.apache.pekko.* via _ or *).'
  - Tests under src/multi-jvm are counted as files only, not analysed as test classes.
  - Test classes whose file names do not end in Spec/Suite/Test/Tests are missed.
  - dependsOn edges may include test-scoped and optional dependencies; scope is not recorded.
