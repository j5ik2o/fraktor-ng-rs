name: CI

on:
  pull_request:
    branches-ignore: [main]
  push:
    branches: [main]
  workflow_call:
    outputs:
      check-result:
        description: Outcome of the last required CI step
        value: ${{ jobs.check.outputs.last-step-result }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      last-step-result: ${{ steps.syn_checker.outcome }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify PR test merge parents
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          checkout_sha=$(git rev-parse --verify HEAD)
          # Read the commit header directly so shallow checkout still exposes both parents.
          parents=$(git cat-file commit "$checkout_sha" | awk '
            /^$/ { body = 1 }
            !body && /^parent / { print $2 }
          ')
          printf 'Checkout SHA: %s\nCheckout parents:\n%s\nEvent base SHA: %s\nEvent head SHA: %s\n' \
            "$checkout_sha" "$parents" "$BASE_SHA" "$HEAD_SHA"
          if [[ -z "$BASE_SHA" || -z "$HEAD_SHA" || "$parents" != "$BASE_SHA"$'\n'"$HEAD_SHA" ]]; then
            echo '::error::The checkout is not a test merge of the event base and head.'
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: npm ci
        run: npm ci
      - uses: astral-sh/setup-uv@v6
      - name: python tests
        run: |
          uv run --with pyyaml python3 ledger/tools/goal_complete_gate_test.py
          uv run --with pyyaml python3 ledger/tools/verify_red_test.py
          uv run --with pyyaml python3 ledger/tools/verify_green_test.py
          uv run --with pyyaml python3 ledger/tools/verify_green_test_aislop.py
          uv run --with pyyaml python3 ledger/tools/verify_green_test_crate.py
          uv run --with pyyaml python3 ledger/tools/pekko_baseline_test.py
          uv run --with pyyaml python3 ledger/tools/retired_lineage_test.py
          uv run --with pyyaml python3 ledger/tools/reverify_against_test.py
          uv run --with pyyaml python3 ledger/tools/relocate_nodes_test.py
          uv run --with pyyaml python3 ledger/tools/report_ledger_1to1_test.py
          uv run --with pyyaml python3 tools/pekko-source/prepare_pekko_source_test.py
          uv run --with pyyaml python3 tools/takt-facets/knowledge_budget_test.py
      - name: Pekko baseline
        run: |
          uv run --with pyyaml python3 ledger/tools/pekko_baseline.py check-ledger --ledger ledger/nodes.yaml
          uv run python3 ledger/tools/pekko_baseline.py check-refs
          uv run --with pyyaml python3 ledger/tools/relocate_nodes.py check
          # 項目 258 (d): 報告書の行と台帳の変更行が 1 対 1 か。検査 1〜5 を 1 つのステップで全部見る
          uv run --with pyyaml python3 ledger/tools/report_ledger_1to1.py check
      - name: check:aislop
        run: npm run check:aislop
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo fmt
        run: cargo fmt --check
      - name: syn checker
        id: syn_checker
        run: |
          for dir in crates/*/; do
            cargo run --quiet --release --locked --manifest-path tools/syn-check/Cargo.toml -- --format json "${dir%/}"
          done

  # Every crates/*/specs/*.qnt is typechecked, its runs are executed and its
  # `invariant` is simulated (scripts/quint-check-specs.sh). This checks the
  # specs themselves; whether the Rust code keeps a spec's properties is checked
  # by the Rust property tests that name the spec (e.g. test_kit_value_test.rs
  # for receive_while.qnt). The glob is re-read on every run: a new crate with
  # specs needs no change to this job. Design: docs/design/quint-in-ci.md.
  quint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: npm ci
        run: npm ci
      # quint's default backend is a Rust evaluator that quint downloads on first
      # use through the unauthenticated GitHub releases API, and only from the
      # first page of that listing. The evaluator is cached here, and fetched with
      # the job token on a cache miss, so quint finds it and never calls the API.
      # The release assets are mutable, so the archive and the executable are
      # checked against sha256 digests pinned per evaluator version; a quint
      # upgrade that brings a new evaluator version fails until its digests are
      # added below.
      - name: Rust evaluator version
        id: evaluator
        run: |
          if [ "$RUNNER_OS" != Linux ] || [ "$RUNNER_ARCH" != X64 ]; then
            echo "::error::the evaluator digests below are for x86_64 Linux, not $RUNNER_OS $RUNNER_ARCH"
            exit 1
          fi
          version=$(node -p "require('@informalsystems/quint/dist/src/rust/binaryManager.js').QUINT_EVALUATOR_VERSION")
          case $version in
            v0.6.0)
              archive_sha256=61755a09d5052d93a4e75e840059edfd0d3674aeda164b9d2464be3d6e21b1c2
              executable_sha256=b2efdeac5713d153e41bf2143b94ed75d888fdd5637f4a5d61a04c695313510a
              ;;
            *)
              echo "::error::no pinned digests for Rust evaluator $version; add them to ci.yml"
              exit 1
              ;;
          esac
          {
            echo "version=$version"
            echo "dir=$HOME/.quint/rust-evaluator-$version"
            echo "archive_sha256=$archive_sha256"
            echo "executable_sha256=$executable_sha256"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: evaluator_cache
        with:
          path: ${{ steps.evaluator.outputs.dir }}
          key: quint-evaluator-${{ runner.os }}-${{ runner.arch }}-${{ steps.evaluator.outputs.version }}-${{ steps.evaluator.outputs.executable_sha256 }}
      - name: fetch the Rust evaluator
        if: steps.evaluator_cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.evaluator.outputs.version }}
          DIR: ${{ steps.evaluator.outputs.dir }}
          ARCHIVE_SHA256: ${{ steps.evaluator.outputs.archive_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/quint_evaluator.tar.gz"
          gh release download "evaluator/$VERSION" --repo informalsystems/quint \
            --pattern quint_evaluator-x86_64-unknown-linux-gnu.tar.gz --output "$archive"
          echo "$ARCHIVE_SHA256  $archive" | sha256sum -c -
          mkdir -p "$DIR"
          tar -xzf "$archive" -C "$DIR"
      - name: check the Rust evaluator
        env:
          DIR: ${{ steps.evaluator.outputs.dir }}
          EXECUTABLE_SHA256: ${{ steps.evaluator.outputs.executable_sha256 }}
        run: |
          set -euo pipefail
          test -x "$DIR/quint_evaluator"
          echo "$EXECUTABLE_SHA256  $DIR/quint_evaluator" | sha256sum -c -
      - name: quint typecheck, test, and a short run
        run: bash scripts/quint-check-specs.sh

  # The Windows IP Helper path of `SystemHostDnsConfiguration` (#160) is built
  # and its real-host test runs only on Windows.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (host DNS configuration)
        run: |
          cargo test -p fraktor-actor --lib adaptor::system_host_dns_configuration
          cargo test -p fraktor-actor --lib adaptor::windows_adapter
          cargo test -p fraktor-actor --lib adaptor::windows_ip_helper
      - name: cargo clippy
        run: cargo clippy -p fraktor-actor --all-targets -- -D warnings
