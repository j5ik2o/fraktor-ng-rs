name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: npm ci
        run: npm ci
      - uses: astral-sh/setup-uv@v6
      - name: python tests
        run: |
          uv run --with pyyaml python3 ledger/tools/goal_complete_gate_test.py
          uv run --with pyyaml python3 ledger/tools/verify_red_test.py
          uv run --with pyyaml python3 ledger/tools/verify_green_test.py
          uv run --with pyyaml python3 ledger/tools/verify_green_test_aislop.py
          uv run --with pyyaml python3 ledger/tools/verify_green_test_crate.py
      - name: check:aislop
        run: npm run check:aislop
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo fmt
        run: cargo fmt --check
      - name: syn checker
        run: |
          for dir in crates/*/; do
            cargo run --quiet --release --locked --manifest-path tools/syn-check/Cargo.toml -- --format json "${dir%/}"
          done

  gate:
    name: Fraktor CI Gate
    needs: check
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Require CI success
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: |
          if [[ "$CHECK_RESULT" != success ]]; then
            printf 'Required CI job check returned %s\n' "${CHECK_RESULT:-<missing>}" >&2
            exit 1
          fi
